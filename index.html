<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Root Favicons (Ensuring Search Engines Find and Display Logo) -->
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/logo-icon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/logo-icon.png" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Premium High-Ranking SEO Titles and Meta Descriptions -->
  <title>Orange Global | Best Platform to Search Jobs, Staffing & Australia Visa Immigration Solutions</title>
  <meta name="description"
    content="Orange Global is the best platform to search jobs, hire talent, and navigate Australia visa immigration. Connect with world-class staffing, recruitment, and global migration solutions." />
  <meta name="keywords"
    content="Orange Global, best platform for search jobs, Australia immigration visa, Australia visa, staffing, find a job, global recruitment agency, staffing agency, talent solutions, executive search, contract staffing, tech hiring, migration solutions, hire talent" />
  <meta name="author" content="Orange Global" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#f97316" />
  <link rel="canonical" href="https://www.orangeglobal.co/" />

  <!-- Rich Open Graph (Facebook/WhatsApp Link Previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.orangeglobal.co/" />
  <meta property="og:title" content="Orange Global | Best Platform to Search Jobs, Staffing & Australia Visa Immigration" />
  <meta property="og:description"
    content="Search jobs, hire talent faster, and obtain Australia visa immigration support with Orange Global's recruitment, staffing, and global migration solutions." />
  <meta property="og:image" content="https://www.orangeglobal.co/images/brand-logo-dark.png" />
  <meta property="og:site_name" content="Orange Global" />

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.orangeglobal.co/" />
  <meta name="twitter:title" content="Orange Global | Best Platform to Search Jobs, Staffing & Australia Visa Immigration" />
  <meta name="twitter:description"
    content="Search jobs, hire talent faster, and obtain Australia visa immigration support with Orange Global's recruitment, staffing, and global migration solutions." />
  <meta name="twitter:image" content="https://www.orangeglobal.co/images/brand-logo-dark.png" />

  <!-- Advanced Schema JSON-LD Markup for High-Authority Ranking -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.orangeglobal.co/#organization",
        "name": "Orange Global",
        "url": "https://www.orangeglobal.co/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.orangeglobal.co/images/logo-icon.png",
          "width": "512",
          "height": "512"
        },
        "image": "https://www.orangeglobal.co/images/brand-logo-dark.png",
        "description": "Orange Global is the best platform to search jobs, staffing solutions, and navigate Australia visa immigration.",
        "sameAs": [
          "https://www.facebook.com/orangeglobal.corp"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://www.orangeglobal.co/#website",
        "url": "https://www.orangeglobal.co/",
        "name": "Orange Global",
        "publisher": {
          "@id": "https://www.orangeglobal.co/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.orangeglobal.co/jobs?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
